<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List of categories</title>

    <!-- 
      defer means that the js file will be downloaded ater the whole DOM is ready
      module enables using the import/export syntax
     -->
    <script src="index.js" defer type="module"></script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="page">
      <div class="page__header"></div>
      <div class="page__navbar"></div>
      <div class="page__content">
        <div class="categories">
          <div class="categories__header">
            <a class="search__button"></a>
          </div>
          <div class="categories__table"></div>
          <div class="spinner__container hidden">
            <div class="spinner">
              <div class="spinner__overlay"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="page__footer"></div>
      <div class="popup-overlay hidden">
        <div class="popup hidden">
          <div class="popup__header">
            <div class="popup__title">Search</div>
            <div class="popup__close">
              <div role="button" class="popup__button--close">+</div>
            </div>
          </div>
          <div class="popup__content"></div>
        </div>
      </div>
    </div>
  </body>

  <template id="search-form-template">
    <form class="search__form">
      <div class="search__fields">search fields</div>
    </form>
  </template>

  <template id="search-field-template">
    <div class="search__field">
      <div class="search__label">Name:</div>
      <div class="search__value">
        <input type="text" name="" class="search__input" value="" />
      </div>
    </div>
  </template>

  <template id="search-footer-template">
    <div class="search__footer">
      <input class="search__submit" type="submit" />
    </div>
  </template>
</html>
